# Render Blueprint — free web + AI
# Free tier allows only ONE Postgres. Use your existing free DB's
# Internal Database URL as DATABASE_URL on ailab-web (set in Dashboard).

services:
  - type: web
    name: ailab-ai
    runtime: docker
    dockerfilePath: ./ai/Dockerfile
    dockerContext: ./ai
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o-mini
      - key: BACKUP_AI_API_KEY
        sync: false
      - key: BACKUP_AI_BASE_URL
        value: https://router.bynara.id/v1
      - key: BACKUP_AI_MODEL
        value: auto/bynara

  - type: web
    name: ailab-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /login.php
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o-mini
      - key: BACKUP_AI_API_KEY
        sync: false
      - key: BACKUP_AI_BASE_URL
        value: https://router.bynara.id/v1
      - key: BACKUP_AI_MODEL
        value: auto/bynara
      - key: AI_SERVICE_URL
        fromService:
          name: ailab-ai
          type: web
          property: host
