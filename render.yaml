# Render Blueprint — free web + AI
# Free tier allows only ONE Postgres. Use your existing free DB's
# Internal Database URL as DATABASE_URL on ailab-web (set in Dashboard).

services:
  - type: web
    name: ailab-ai
    runtime: docker
    dockerfilePath: ./ai/Dockerfile
    dockerContext: ./ai
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"

  - type: web
    name: ailab-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /login.php
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AI_SERVICE_URL
        fromService:
          name: ailab-ai
          type: web
          property: host
