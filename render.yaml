# Render Blueprint — free web + AI + Postgres
# Dashboard: New → Blueprint → Connect this repo

databases:
  - name: ailab-db
    plan: free

services:
  - type: web
    name: ailab-ai
    runtime: docker
    dockerfilePath: ./ai/Dockerfile
    dockerContext: ./ai
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"

  - type: web
    name: ailab-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /login.php
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ailab-db
          property: connectionString
      - key: AI_SERVICE_URL
        fromService:
          name: ailab-ai
          type: web
          property: host
