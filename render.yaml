# Render Blueprint — web + AI + Postgres
# Free workspaces allow only ONE Postgres. If create fails, reuse your existing
# instance and paste its Internal Database URL into ailab-web → Environment.

databases:
  - name: ailab-db
    databaseName: ailab_lis
    user: ailab
    plan: free

services:
  - type: web
    name: ailab-ai
    runtime: docker
    dockerfilePath: ./ai/Dockerfile
    dockerContext: ./ai
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: BACKUP_AI_API_KEY
        sync: false
      - key: BACKUP_AI_BASE_URL
        value: https://router.bynara.id/v1
      - key: BACKUP_AI_MODEL
        value: auto/bynara

  - type: web
    name: ailab-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /login.php
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ailab-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: BACKUP_AI_API_KEY
        sync: false
      - key: BACKUP_AI_BASE_URL
        value: https://router.bynara.id/v1
      - key: BACKUP_AI_MODEL
        value: auto/bynara
      # Isolation Forest runs inside ailab-web so free-tier sleep cannot mark it offline.
      - key: START_EMBEDDED_AI
        value: "1"
      - key: AI_SERVICE_URL
        value: http://127.0.0.1:5001
      - key: AI_ENDPOINT
        value: http://127.0.0.1:5001/predict
      - key: AI_HEALTH_ENDPOINT
        value: http://127.0.0.1:5001/health
